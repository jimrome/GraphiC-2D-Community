[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphic-scientific"
version = "7.3.0"
authors = [
  { name="Scientific Endeavors Corporation" },
]
description = "Publication-Quality Scientific Graphics Library with Native SVG Output"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
all = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphic*"]
