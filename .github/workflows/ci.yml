name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu (gfortran / gcc)"
            os: ubuntu-latest
            compiler: gcc
            version: "latest"
          - name: "Ubuntu (Intel ifx / icx)"
            os: ubuntu-latest
            compiler: intel
            version: "latest"
          - name: "macOS (gfortran / gcc)"
            os: macos-latest
            compiler: gcc
            version: "latest"
          - name: "Windows (gfortran / MinGW)"
            os: windows-latest
            compiler: gcc
            version: "latest"
          - name: "Windows (Intel ifx / icx)"
            os: windows-latest
            compiler: intel
            version: "latest"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fortran & C toolchain (${{ matrix.compiler }})
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v10
        with:
          version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display compiler and fpm versions
        run: |
          echo "FPM_FC=${FPM_FC}"
          echo "FPM_CC=${FPM_CC}"
          ${FPM_FC} --version || true
          ${FPM_CC} --version || true
          fpm --version

      - name: Build GraphiC library and all examples
        run: |
          fpm build

      - name: Run all Fortran examples and verify SVG output
        run: |
          examples=(sample d2test logtest bartest erftest multi_y svgtest turbulence)
          expected_svgs=(sample.svg d2test.svg logtest.svg bartest.svg erftest.svg multi_y.svg svgtest_1.svg turbulence.svg)
          for i in "${!examples[@]}"; do
            ex="${examples[$i]}"
            svg="${expected_svgs[$i]}"
            echo "=== Running example: ${ex} ==="
            rm -f "${svg}"
            fpm run --example "${ex}"
            if [ ! -s "${svg}" ]; then
              echo "ERROR: Expected non-empty SVG file '${svg}' from example '${ex}'"
              exit 1
            fi
          done

      - name: Build and run standalone fpm client project (local checkout dependency)
        working-directory: fortran/fpm_client
        run: |
          cp fpm.toml fpm.toml.orig
          sed 's|git = "https://github.com/jimrome/GraphiC-2D-Community.git"|path = "../.."|' fpm.toml.orig > fpm.toml
          rm -rf build damped_oscillator.svg damped_oscillator.html
          fpm run
          test -s damped_oscillator.svg
          mv fpm.toml.orig fpm.toml
          rm -rf build damped_oscillator.svg damped_oscillator.html

      - name: Build and run standalone fpm client project (git dependency)
        working-directory: fortran/fpm_client
        run: |
          rm -rf build damped_oscillator.svg damped_oscillator.html
          fpm run
          test -s damped_oscillator.svg
